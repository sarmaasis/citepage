<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk — Citepage</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/citepage.css" />
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="mark plain" href="/">Citepage<span>.</span></a>
      <nav class="site">
        <a href="/docs.html">Docs</a>
      </nav>
    </header>
  </div>
  <hr class="rule" />
  <div class="desk wrap">
    <aside class="rail">
      <h2>Pages</h2>
      <div id="list"></div>
      <div style="padding:16px 24px 8px">
        <h2>Add a page</h2>
        <input id="title" placeholder="Title" style="width:100%;border:1px solid var(--rule);padding:8px;margin-bottom:8px;font-family:var(--mono);font-size:12px" />
        <textarea id="body" placeholder="Paste markdown or plain text from your docs"></textarea>
        <button class="btn" id="ingest" type="button">Index this page</button>
        <p class="hint" id="ingest-msg"></p>
      </div>
    </aside>
    <main class="stage">
      <p class="kicker">Indexed pages only. Empty retrieval = refuse.</p>
      <div class="askbar">
        <input id="q" type="text" placeholder="Ask something that should be on the page" />
        <button class="btn" id="go" type="button">Ask</button>
      </div>
      <div id="out"></div>
      <article class="passages" id="view"></article>
    </main>
  </div>
  <script src="/js/desk.js"></script>
</body>
</html>
